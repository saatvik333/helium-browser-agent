[package]
name = "hba"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Drive your running Helium browser from the command line: profiles, tabs, pages, DevTools and extensions"
license = "Apache-2.0"
repository = "https://github.com/saatvik333/helium-browser-agent"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.100"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
fastrand = "2.3"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
shlex = "1.3"
similar = "3"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Application crate: errors are reported to the user, not documented per function.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Screen coordinates and protocol numbers are f64 by definition; casts are checked where they matter.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Command-line flags and protocol mirrors are independent booleans, not hidden state machines.
struct_excessive_bools = "allow"
