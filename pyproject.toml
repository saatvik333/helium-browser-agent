[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "helium-browser-agent"
version = "0.1.0"
description = "Profile-aware, task-owned Helium browser automation for Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
authors = [{name = "Saatvik Sharma"}]
dependencies = ["browser-harness==0.1.13", "websockets==15.0.1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
helium-browser-use = "helium_browser_agent.cli:cli"
agent-browser-helium = "helium_browser_agent.helium_agent:cli"
helium-tab = "helium_browser_agent.tab:cli"
helium-agent = "helium_browser_agent.diagnostics:cli"

[dependency-groups]
dev = ["ruff==0.14.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E731", "E741"]
