<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture home</title></head>
<body>
<h1>Fixture home</h1>
<nav><a href="/page2.html">Second page</a> <a id="external" href="https://example.com/">Example</a></nav>
<p id="status">idle</p>
<button id="popup" onclick="window.open('/page2.html', '_blank')">Open popup</button>
<button id="confirm" onclick="document.getElementById('status').textContent = confirm('Delete everything?') ? 'confirmed' : 'kept'">Delete</button>
<button id="alert" onclick="alert('Saved!'); document.getElementById('status').textContent = 'alerted'">Save</button>
<button id="later" onclick="setTimeout(() => { const b = document.createElement('button'); b.textContent = 'Appeared'; b.onclick = () => document.getElementById('status').textContent = 'appeared clicked'; document.body.append(b); }, 400)">Show later</button>
<button id="broken" onclick="console.error('boom from fixture'); fetch('/missing.json')">Break things</button>
<div style="position: relative; height: 40px">
  <button id="covered" onclick="document.getElementById('status').textContent = 'covered clicked'">Covered</button>
  <div id="overlay" onclick="this.remove()" style="position: absolute; inset: 0; background: rgba(0,0,0,.2)">overlay</div>
</div>
<form id="login" onsubmit="event.preventDefault(); document.getElementById('status').textContent = 'submitted ' + this.user.value">
  <label>User <input name="user" autocomplete="off"></label>
  <label>Notes <textarea name="notes"></textarea></label>
  <div id="editor" contenteditable="true" aria-label="Editor"></div>
  <button>Sign in</button>
</form>
<div style="height: 2000px"></div>
<button id="bottom" onclick="document.getElementById('status').textContent = 'bottom clicked'">Bottom button</button>
</body>
</html>
